name: QORVEX V2 responsive browser QA
on:
  push:
    branches:
      - feature/qorvex-experience-v2

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "APEX SYNC INTELLIGENCE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "APEX SYNC INTELLIGENCE/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qorvex-preview.log 2>&1 &
          sleep 4
      - name: Check seven responsive sizes and interactions
        run: node scripts/responsive-check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qorvex-v2-responsive-screens
          path: "APEX SYNC INTELLIGENCE/qa-output/"
          if-no-files-found: ignore
